<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Telegram Case Game</title>
  
  <!-- Настройка под мобильный экран -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Подключение CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Контейнер игры -->
  <div id="gameContainer">

    <!-- Главная страница -->
    <div id="pageMain" class="page active">
      <button id="openCase">Открыть</button>
      <div id="cardDisplay"></div>
    </div>

    <!-- Профиль -->
    <div id="pageProfile" class="page">
      <h2>Профиль</h2>
      <p>Здесь будет информация о пользователе</p>
    </div>

    <!-- Настройки -->
    <div id="pageSettings" class="page">
      <h2>Настройки</h2>
      <p>Здесь будут настройки игры</p>
    </div>

  <!-- Нижнее меню -->
    <div id="bottomMenu">
      <button class="menuBtn active" data-page="pageMain">Главная</button>
      <button class="menuBtn" data-page="pageProfile">Профиль</button>
      <button class="menuBtn" data-page="pageSettings">Настройки</button>
    </div>
  </div>



  <!-- Подключение игрового JS -->
  <script src="game.js"></script>
</body>
</html>
