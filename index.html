<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Telegram Case Game</title>
  
  <!-- Настройка под мобильный экран -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Подключение CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Контейнер игры -->
  <div id="gameContainer">
    <button id="openCase">Открыть кейс</button>
    <div id="cardDisplay"></div>
  </div>

  <!-- Подключение JS -->
  <script src="game.js"></script>
  
  <!-- Код открытия кейса -->
  <script>
    document.getElementById("openCase").onclick = () => {
      const card = getRandomCard();
      document.getElementById("cardDisplay").innerText = `${card.name}`;
    };
  </script>

</body>
</html>
