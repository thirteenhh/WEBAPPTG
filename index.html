<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Telegram Case Game</title>
  
  <!-- Настройка под мобильный экран -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Подключение CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Контейнер игры -->
  <div id="gameContainer">

    <!-- Главная страница -->
    <div id="pageMain" class="page active">
      <div id="miniProfile">
        <img id="userAvatar" src="" alt="Аватар">
        <span id="userName"></span>
      </div>

      <button id="openCase">Открыть</button>
      <div id="cardDisplay"></div>
    </div>

    <!-- Профиль -->
    <div id="pageProfile" class="page">
      <h2>Профиль</h2>
      <p>Здесь будет информация о пользователе</p>
    </div>

    <!-- Настройки -->
    <div id="pageSettings" class="page">
      <h2>Настройки</h2>
      <p>Здесь будут настройки игры</p>
    </div>

    <!-- Нижнее меню -->
    <div id="bottomMenu">
      <button class="menuBtn active" data-page="pageMain">Главная</button>
      <button class="menuBtn" data-page="pageProfile">Профиль</button>
      <button class="menuBtn" data-page="pageSettings">Настройки</button>
    </div>

  </div>

  <!-- Подключение игрового JS -->
  <script src="game.js"></script>

  <script>
    // Подгружаем аватарку и имя пользователя через Telegram Web App
    document.addEventListener("DOMContentLoaded", () => {
      const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
      const avatarImg = document.getElementById("userAvatar");
      const nameSpan = document.getElementById("userName");

      if (tgUser) {
        avatarImg.src = tgUser.photo_url || "img/avatar.png"; // fallback на локальный аватар
        nameSpan.textContent = tgUser.first_name || "Имя пользователя";
      } else {
        // Если пользователь не доступен, показываем заглушку
        avatarImg.src = "img/avatar.png";
        nameSpan.textContent = "Имя пользователя";
      }
    });
  </script>

</body>
</html>
