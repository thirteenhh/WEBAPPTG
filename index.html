<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Telegram Case Game</title>
  
  <!-- Настройка под мобильный экран -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Подключение CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Контейнер игры -->
  <div id="gameContainer">

    <!-- Главная страница -->
    <div id="pageMain" class="page active">
      <div id="miniProfile">
        <img id="userAvatar" alt="Аватар">
        <span id="userName"></span>
      </div>

      <button id="openCase">Открыть</button>
      <div id="cardDisplay"></div>
    </div>

    <!-- Профиль -->
    <div id="pageProfile" class="page">
  <div id="profileTop">
    <img id="profileAvatar">
    <h3 id="profileName"></h3>
  </div>
  <div id="profileBottom">
    <div id="profileCards" class="scrollable"></div>
  </div>
</div>


    <!-- Настройки -->
    <div id="pageSettings" class="page">
      <h2>Настройки</h2>
      <p>Здесь будут настройки игры</p>
    </div>

    <!-- Нижнее меню: единый прямоугольник -->
    <div id="bottomMenu">
      <div class="menuBtn active" data-page="pageMain">Главная</div>
      <div class="menuBtn" data-page="pageProfile">Профиль</div>
      <div class="menuBtn" data-page="pageSettings">Настройки</div>
    </div>

  </div>

  <!-- Подключение игрового JS -->
  <script src="game.js"></script>

  <script>
    // Подгружаем аватарку и имя пользователя через Telegram Web App
    document.addEventListener("DOMContentLoaded", () => {
      const tg = window.Telegram.WebApp;
      tg?.ready();

      const tgUser = tg?.initDataUnsafe?.user || {};
      const avatarImg = document.getElementById("userAvatar");
      const nameSpan = document.getElementById("userName");
      const profileAvatar = document.getElementById("profileAvatar");
      const profileName = document.getElementById("profileName");

      const fullName = tgUser.first_name 
        ? tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "")
        : "Имя пользователя";

      avatarImg.src = tgUser.photo_url || "img/avatar.png";
      nameSpan.textContent = fullName;
      profileAvatar.src = tgUser.photo_url || "img/avatar.png";
      profileName.textContent = fullName;
    });
  </script>

</body>
</html>
